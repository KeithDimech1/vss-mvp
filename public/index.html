<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clair Advisory - Strategic Business Consulting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #2d5f3f 0%, #1a3d2a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }
        .container {
            text-align: center;
            max-width: 800px;
            padding: 40px 20px;
        }
        .logo {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            text-transform: uppercase;
            color: #ffffff;
        }
        .tagline {
            font-size: 1.25rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: #c8e6d4;
            margin-bottom: 2rem;
        }
        .divider {
            width: 60px;
            height: 2px;
            background: #c8e6d4;
            margin: 2rem auto;
        }
        .description {
            font-size: 1rem;
            line-height: 1.8;
            color: #e8f5ed;
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
        }
        .footer {
            margin-top: 3rem;
            font-size: 0.875rem;
            color: #a8d4bb;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">Clair Advisory</h1>
        <p class="tagline">Strategic Business Consulting</p>
        <div class="divider"></div>
        <p class="description">
            We provide expert strategic consulting services to help businesses
            navigate complex challenges, optimize operations, and achieve
            sustainable growth in an evolving marketplace.
        </p>
        <div class="footer">
            © 2025 Clair Advisory. All rights reserved.
        </div>
    </div>
</body>
</html>
