<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <!-- Background -->
  <rect width="800" height="450" fill="#f8fafc"/>

  <!-- Title Banner -->
  <rect x="50" y="20" width="700" height="50" rx="8" fill="#1e3a5f"/>
  <text x="400" y="52" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">LITHODAT AI-READY DATA PIPELINE FOR GDAC-SA</text>

  <!-- Connector from title -->
  <line x1="400" y1="70" x2="400" y2="100" stroke="#1e3a5f" stroke-width="3"/>

  <!-- Three-way split -->
  <path d="M 150 100 L 400 100 L 650 100" stroke="#1e3a5f" stroke-width="3" fill="none"/>
  <line x1="150" y1="100" x2="150" y2="130" stroke="#1e3a5f" stroke-width="3"/>
  <line x1="400" y1="100" x2="400" y2="130" stroke="#1e3a5f" stroke-width="3"/>
  <line x1="650" y1="100" x2="650" y2="130" stroke="#1e3a5f" stroke-width="3"/>

  <!-- Arrows -->
  <polygon points="150,130 145,120 155,120" fill="#1e3a5f"/>
  <polygon points="400,130 395,120 405,120" fill="#1e3a5f"/>
  <polygon points="650,130 645,120 655,120" fill="#1e3a5f"/>

  <!-- Box 1: Data Ingestion -->
  <rect x="50" y="135" width="200" height="160" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
  <rect x="50" y="135" width="200" height="40" rx="10" fill="#3b82f6"/>
  <rect x="50" y="165" width="200" height="10" fill="#3b82f6"/>
  <text x="150" y="162" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">DATA INGESTION</text>

  <!-- Icon for Data Ingestion -->
  <circle cx="150" cy="210" r="20" fill="#dbeafe"/>
  <path d="M140 205 L150 215 L160 205 M150 195 L150 215" stroke="#3b82f6" stroke-width="2" fill="none" stroke-linecap="round"/>

  <text x="150" y="250" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Multi-format adapters</text>
  <text x="150" y="267" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Validation pipelines</text>
  <text x="150" y="284" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Quality scoring</text>

  <!-- Box 2: Standardization -->
  <rect x="300" y="135" width="200" height="160" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
  <rect x="300" y="135" width="200" height="40" rx="10" fill="#10b981"/>
  <rect x="300" y="165" width="200" height="10" fill="#10b981"/>
  <text x="400" y="162" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">STANDARDIZATION</text>

  <!-- Icon for Standardization -->
  <circle cx="400" cy="210" r="20" fill="#d1fae5"/>
  <rect x="388" y="200" width="24" height="20" rx="2" stroke="#10b981" stroke-width="2" fill="none"/>
  <line x1="392" y1="206" x2="408" y2="206" stroke="#10b981" stroke-width="2"/>
  <line x1="392" y1="212" x2="404" y2="212" stroke="#10b981" stroke-width="2"/>

  <text x="400" y="250" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">SKOS vocabulary</text>
  <text x="400" y="267" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11" font-weight="bold">(50,000+ terms)</text>
  <text x="400" y="284" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Unit normalization</text>

  <!-- Box 3: AI Application -->
  <rect x="550" y="135" width="200" height="160" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="550" y="135" width="200" height="40" rx="10" fill="#8b5cf6"/>
  <rect x="550" y="165" width="200" height="10" fill="#8b5cf6"/>
  <text x="650" y="162" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">AI APPLICATION</text>

  <!-- Icon for AI -->
  <circle cx="650" cy="210" r="20" fill="#ede9fe"/>
  <circle cx="650" cy="210" r="8" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="640" cy="200" r="3" fill="#8b5cf6"/>
  <circle cx="660" cy="200" r="3" fill="#8b5cf6"/>
  <circle cx="640" cy="220" r="3" fill="#8b5cf6"/>
  <circle cx="660" cy="220" r="3" fill="#8b5cf6"/>
  <line x1="643" y1="203" x2="647" y2="207" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="657" y1="203" x2="653" y2="207" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="643" y1="217" x2="647" y2="213" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="657" y1="217" x2="653" y2="213" stroke="#8b5cf6" stroke-width="1.5"/>

  <text x="650" y="250" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">ML training ready</text>
  <text x="650" y="267" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Pattern detection</text>
  <text x="650" y="284" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="11">Prospectivity mapping</text>

  <!-- Connectors to bottom -->
  <line x1="150" y1="295" x2="150" y2="340" stroke="#1e3a5f" stroke-width="2"/>
  <line x1="400" y1="295" x2="400" y2="340" stroke="#1e3a5f" stroke-width="2"/>
  <line x1="650" y1="295" x2="650" y2="340" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Arrows to bottom -->
  <polygon points="150,340 145,330 155,330" fill="#1e3a5f"/>
  <polygon points="400,340 395,330 405,330" fill="#1e3a5f"/>
  <polygon points="650,340 645,330 655,330" fill="#1e3a5f"/>

  <!-- Merge lines -->
  <path d="M 150 340 L 150 360 L 650 360 L 650 340" stroke="#1e3a5f" stroke-width="2" fill="none"/>
  <line x1="400" y1="360" x2="400" y2="380" stroke="#1e3a5f" stroke-width="3"/>
  <polygon points="400,385 395,375 405,375" fill="#1e3a5f"/>

  <!-- Bottom Banner: Production Platforms -->
  <rect x="100" y="390" width="600" height="50" rx="8" fill="#1e3a5f"/>
  <text x="400" y="412" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold">PROVEN IN PRODUCTION PLATFORMS</text>
  <text x="400" y="432" text-anchor="middle" fill="#93c5fd" font-family="Arial, sans-serif" font-size="12">EarthBank: 350,000 samples  |  Isotopes.au  |  LithoSpace</text>
</svg>