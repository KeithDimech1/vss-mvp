  <text x="600" y="95" text-anchor="middle" class="box-title">GDAC-SA PROJECT LEADS</text>
  <text x="600" y="112" text-anchor="middle" class="box-subtitle">(AbuAli / Abeed / Dimech)</text>

  <!-- Connector from Project Leads to Team Leads -->
  <line x1="600" y1="125" x2="600" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="155" x2="1000" y2="155" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="155" x2="200" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="600" y1="155" x2="600" y2="180" stroke="#94a3b8" stroke-width="2"/>
