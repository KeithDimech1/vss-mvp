  <rect x="900" y="550" width="250" height="90" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1025" y="575" text-anchor="middle" class="legend-title">Legend</text>
  <rect x="920" y="588" width="20" height="14" rx="3" fill="#1e3a5f"/>
