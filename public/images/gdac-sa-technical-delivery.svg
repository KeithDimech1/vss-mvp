  <text x="925" y="450" text-anchor="middle" class="dev-tech">Data Validation</text>
  <text x="925" y="462" text-anchor="middle" class="dev-tech">Mexico</text>

  <rect x="1000" y="370" width="150" height="100" rx="8" fill="#10b981"/>
