  <line x1="215" y1="430" x2="335" y2="430" stroke="white" stroke-width="1" opacity="0.3"/>
  <text x="275" y="450" text-anchor="middle" class="dev-tech">React, TypeScript</text>
  <text x="275" y="462" text-anchor="middle" class="dev-tech">UI/UX Implementation</text>

