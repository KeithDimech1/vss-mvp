  <line x1="525" y1="340" x2="675" y2="340" stroke="#94a3b8" stroke-width="2"/>
  <line x1="525" y1="340" x2="525" y2="370" stroke="#94a3b8" stroke-width="2"/>
  <line x1="675" y1="340" x2="675" y2="370" stroke="#94a3b8" stroke-width="2"/>

  <line x1="1000" y1="300" x2="1000" y2="340" stroke="#94a3b8" stroke-width="2"/>
  <line x1="925" y1="340" x2="1075" y2="340" stroke="#94a3b8" stroke-width="2"/>
  <line x1="925" y1="340" x2="925" y2="370" stroke="#94a3b8" stroke-width="2"/>
  <line x1="1075" y1="340" x2="1075" y2="370" stroke="#94a3b8" stroke-width="2"/>

