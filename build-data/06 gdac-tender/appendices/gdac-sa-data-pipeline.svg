<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 920" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2c5282"/>
    </linearGradient>
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3182ce"/>
      <stop offset="100%" style="stop-color:#2b6cb0"/>
    </linearGradient>
    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38a169"/>
      <stop offset="100%" style="stop-color:#2f855a"/>
    </linearGradient>
    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#805ad5"/>
      <stop offset="100%" style="stop-color:#6b46c1"/>
    </linearGradient>
    <linearGradient id="step4Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e53e3e"/>
      <stop offset="100%" style="stop-color:#c53030"/>
    </linearGradient>
    <linearGradient id="step5Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dd6b20"/>
      <stop offset="100%" style="stop-color:#c05621"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="920" fill="#f7fafc"/>

  <!-- Header -->
  <rect x="50" y="20" width="800" height="60" rx="8" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="450" y="48" text-anchor="middle" font-size="22" font-weight="bold" fill="white">LITHODAT AI-READY DATA PIPELINE</text>
  <text x="450" y="68" text-anchor="middle" font-size="12" fill="#cbd5e0">"Clean Data First" Methodology for GDAC-SA</text>

  <!-- Step 1: Data Ingestion -->
  <rect x="50" y="100" width="800" height="130" rx="8" fill="white" stroke="#3182ce" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="100" width="800" height="35" rx="8" fill="url(#step1Grad)"/>
  <rect x="50" y="127" width="800" height="8" fill="url(#step1Grad)"/>
  <circle cx="80" cy="117" r="14" fill="white"/>
  <text x="80" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#3182ce">1</text>
  <text x="110" y="123" font-size="14" font-weight="bold" fill="white">DATA INGESTION</text>

  <!-- Step 1 Content -->
  <text x="70" y="155" font-size="11" fill="#2d3748">• Multi-format adapters (PDF, CSV, databases, legacy systems)</text>
  <text x="70" y="172" font-size="11" fill="#2d3748">• Automated validation against geoscience vocabularies</text>
  <text x="70" y="189" font-size="11" fill="#2d3748">• Quality scoring at point of entry</text>

  <!-- Step 1 Leads - UPDATED -->
  <rect x="550" y="145" width="280" height="75" rx="6" fill="#ebf8ff" stroke="#bee3f8" stroke-width="1"/>
  <text x="565" y="162" font-size="9" font-weight="bold" fill="#2b6cb0">Technical Lead:</text>
  <text x="565" y="175" font-size="9" fill="#2d3748">Gerd Moritz Theile (Chief Technology Officer)</text>
  <text x="565" y="195" font-size="9" font-weight="bold" fill="#2b6cb0">Domain Lead:</text>
  <text x="565" y="208" font-size="9" fill="#2d3748">Dr. Wayne Peter Noble (Chief Information Officer)</text>

  <!-- Arrow 1 -->
  <line x1="450" y1="230" x2="450" y2="255" stroke="#4a5568" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Semantic Standardization -->
  <rect x="50" y="260" width="800" height="130" rx="8" fill="white" stroke="#38a169" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="260" width="800" height="35" rx="8" fill="url(#step2Grad)"/>
  <rect x="50" y="287" width="800" height="8" fill="url(#step2Grad)"/>
  <circle cx="80" cy="277" r="14" fill="white"/>
  <text x="80" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#38a169">2</text>
  <text x="110" y="283" font-size="14" font-weight="bold" fill="white">SEMANTIC STANDARDIZATION</text>

  <!-- Step 2 Content -->
  <text x="70" y="315" font-size="11" fill="#2d3748">• SKOS-based controlled vocabularies (minerals, rock types, methods)</text>
  <text x="70" y="332" font-size="11" fill="#2d3748">• Ontology mapping for heterogeneous sources</text>
  <text x="70" y="349" font-size="11" fill="#2d3748">• Unit normalization (SI units, coordinate systems)</text>

  <!-- Step 2 Leads - UPDATED -->
  <rect x="550" y="305" width="280" height="75" rx="6" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1"/>
  <text x="565" y="322" font-size="9" font-weight="bold" fill="#276749">Technical Lead:</text>
  <text x="565" y="335" font-size="9" fill="#2d3748">Gerd Moritz Theile (Chief Technology Officer)</text>
  <text x="565" y="355" font-size="9" font-weight="bold" fill="#276749">Data Systems:</text>
  <text x="565" y="368" font-size="9" fill="#2d3748">Dr. Fabian Kohlmann (Chief Executive)</text>

  <!-- Arrow 2 -->
  <line x1="450" y1="390" x2="450" y2="415" stroke="#4a5568" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Database Storage (KEPT AS IS) -->
  <rect x="50" y="420" width="800" height="130" rx="8" fill="white" stroke="#805ad5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="420" width="800" height="35" rx="8" fill="url(#step3Grad)"/>
  <rect x="50" y="447" width="800" height="8" fill="url(#step3Grad)"/>
  <circle cx="80" cy="437" r="14" fill="white"/>
  <text x="80" y="442" text-anchor="middle" font-size="14" font-weight="bold" fill="#805ad5">3</text>
  <text x="110" y="443" font-size="14" font-weight="bold" fill="white">RELATIONAL DATABASE STORAGE (FAIR-COMPLIANT)</text>

  <!-- Step 3 Content -->
  <text x="70" y="475" font-size="11" fill="#2d3748">• PostgreSQL with PostGIS for spatial data</text>
  <text x="70" y="492" font-size="11" fill="#2d3748">• Full audit trail and provenance tracking</text>
  <text x="70" y="509" font-size="11" fill="#2d3748">• RESTful APIs for programmatic access</text>

  <!-- Step 3 Leads -->
  <rect x="550" y="465" width="280" height="75" rx="6" fill="#faf5ff" stroke="#d6bcfa" stroke-width="1"/>
  <text x="565" y="482" font-size="9" font-weight="bold" fill="#553c9a">Technical Lead:</text>
  <text x="565" y="495" font-size="9" fill="#2d3748">Dr. Wayne Peter Noble (Chief Information Officer)</text>
  <text x="565" y="515" font-size="9" font-weight="bold" fill="#553c9a">Quality Systems:</text>
  <text x="565" y="528" font-size="9" fill="#2d3748">Keith Dimech (Chief Operating Officer)</text>

  <!-- Arrow 3 -->
  <line x1="450" y1="550" x2="450" y2="575" stroke="#4a5568" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Step 4: SGS PORTAL (NEW) -->
  <rect x="50" y="580" width="800" height="145" rx="8" fill="white" stroke="#e53e3e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="580" width="800" height="35" rx="8" fill="url(#step4Grad)"/>
  <rect x="50" y="607" width="800" height="8" fill="url(#step4Grad)"/>
  <circle cx="80" cy="597" r="14" fill="white"/>
  <text x="80" y="602" text-anchor="middle" font-size="14" font-weight="bold" fill="#e53e3e">4</text>
  <text x="110" y="603" font-size="14" font-weight="bold" fill="white">SGS LIVE PORTAL DEVELOPMENT</text>

  <!-- Step 4 Content -->
  <text x="70" y="635" font-size="11" fill="#2d3748">• Public-facing data portal for open geoscience data access</text>
  <text x="70" y="652" font-size="11" fill="#2d3748">• Private secure area for SGS internal data and workflows</text>
  <text x="70" y="669" font-size="11" fill="#2d3748">• Admin controls, user management, and role-based access</text>
  <text x="70" y="686" font-size="11" fill="#2d3748">• Dual toolsets: public analytics + internal SGS-only features</text>

  <!-- Step 4 Leads -->
  <rect x="550" y="625" width="280" height="90" rx="6" fill="#fff5f5" stroke="#feb2b2" stroke-width="1"/>
  <text x="565" y="642" font-size="9" font-weight="bold" fill="#c53030">Technical Lead:</text>
  <text x="565" y="655" font-size="9" fill="#2d3748">Dr. Wayne Peter Noble (Chief Information Officer)</text>
  <text x="565" y="675" font-size="9" font-weight="bold" fill="#c53030">Client Liaison:</text>
  <text x="565" y="688" font-size="9" fill="#2d3748">Keith Dimech (Chief Operating Officer)</text>
  <text x="565" y="705" font-size="9" font-weight="bold" fill="#c53030">Frontend Dev:</text>
  <text x="565" y="718" font-size="9" fill="#2d3748">Lujia Yang, Xinyan Zhang</text>

  <!-- Arrow 4 -->
  <line x1="450" y1="725" x2="450" y2="750" stroke="#4a5568" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Step 5: AI/ML Layer (WAS Step 4, KEPT AS IS) -->
  <rect x="50" y="755" width="800" height="145" rx="8" fill="white" stroke="#dd6b20" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="755" width="800" height="35" rx="8" fill="url(#step5Grad)"/>
  <rect x="50" y="782" width="800" height="8" fill="url(#step5Grad)"/>
  <circle cx="80" cy="772" r="14" fill="white"/>
  <text x="80" y="777" text-anchor="middle" font-size="14" font-weight="bold" fill="#dd6b20">5</text>
  <text x="110" y="778" font-size="14" font-weight="bold" fill="white">AI/ML APPLICATION LAYER</text>

  <!-- Step 5 Content -->
  <text x="70" y="810" font-size="11" fill="#2d3748">• Feature engineering from clean structured data</text>
  <text x="70" y="827" font-size="11" fill="#2d3748">• Machine learning model training (classification, regression, clustering)</text>
  <text x="70" y="844" font-size="11" fill="#2d3748">• Mineral prospectivity mapping and target generation</text>
  <text x="70" y="861" font-size="11" fill="#2d3748">• Time series analysis and trend detection</text>

  <!-- Step 5 Leads -->
  <rect x="550" y="800" width="280" height="90" rx="6" fill="#fffaf0" stroke="#fbd38d" stroke-width="1"/>
  <text x="565" y="820" font-size="9" font-weight="bold" fill="#c05621">ML Technical Advisor:</text>
  <text x="565" y="833" font-size="9" fill="#2d3748">Dr. Behnam Sadeghi</text>
  <text x="565" y="846" font-size="9" fill="#2d3748">(Geological ML Technical Advisor)</text>
  <text x="565" y="866" font-size="9" font-weight="bold" fill="#c05621">AI Software Dev Lead:</text>
  <text x="565" y="879" font-size="9" fill="#2d3748">Pedro Ferreira (AI Software Development Lead)</text>

  <!-- Footer -->
  <text x="450" y="912" text-anchor="middle" font-size="10" fill="#718096">Lithodat Pty Ltd | GDAC-SA Pre-Qualification | Form 9.4</text>
</svg>